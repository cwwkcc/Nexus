name: CD

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (branch, tag, or commit SHA) to deploy'
        required: false
        default: main

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  guard:
    # Only deploy manual dispatches, or CI runs that succeeded on main.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Resolve ref/SHA to deploy
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "sha=${{ github.event.inputs.ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    needs: guard
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - app: web
            dockerfile: apps/web/Dockerfile
            image: nexus-web
          - app: admin
            dockerfile: apps/admin/Dockerfile
            image: nexus-admin
          - app: migrate
            dockerfile: apps/migrate/Dockerfile
            image: nexus-migrate
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ needs.guard.outputs.sha }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    needs: [guard, build-and-push]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Roll out new images with automatic rollback
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USERNAME }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: ${{ secrets.HETZNER_PORT || 22 }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/nexus

            NEW_TAG="${{ needs.guard.outputs.sha }}"
            cp .env .env.rollback

            rollback() {
              echo "Health checks failed — rolling back to the previous images." >&2
              mv .env.rollback .env
              docker compose pull
              docker compose up -d --wait --wait-timeout 120
              exit 1
            }
            trap rollback ERR

            sed -i '/^WEB_IMAGE_TAG=/d;/^ADMIN_IMAGE_TAG=/d;/^MIGRATE_IMAGE_TAG=/d' .env
            {
              echo "WEB_IMAGE_TAG=${NEW_TAG}"
              echo "ADMIN_IMAGE_TAG=${NEW_TAG}"
              echo "MIGRATE_IMAGE_TAG=${NEW_TAG}"
            } >> .env

            docker compose pull

            # Run migrations BEFORE bringing up the new app containers, using
            # the dedicated one-shot migrate service (it, not nexus-web,
            # carries the pnpm workspace + Prisma CLI needed to run this).
            docker compose run --rm migrate

            docker compose up -d --wait --wait-timeout 120

            # docker compose --wait already gates on the container
            # healthchecks; this also confirms Caddy is routing correctly.
            curl --fail --silent --max-time 10 https://cwwkcc.lk/api/health
            curl --fail --silent --max-time 10 https://admin.cwwkcc.lk/api/health

            trap - ERR
            rm -f .env.rollback
            echo "Deployed ${NEW_TAG} successfully."
